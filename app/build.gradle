// Code 22, Oct 29, 2026 (Wilson): learned next-word pairs
// are no longer capped at 500 — the cap is removed, so
// his own sentence habits are never thrown away. No
// other feature changes from code 21.

// Code 23, Oct 29, 2026 (Wilson): bigger on-device
// sentence model — pruned 4-gram / 5-gram table in
// assets/ngram_model.txt (131,304 contexts, 3,946,959
// bytes, built from WikiText-2 + Samsum +
// EmpatheticDialogues, conversational first).
// Prediction order: learned pairs, then n-gram,
// then trigram, then bigram. No other changes.

// Code 24, Oct 29, 2026 (Wilson): autocorrect undos
// + proper-name guard. (1) Backspace right after a
// Space or Enter correction now undoes the whole
// correction (restores original + space/newline,
// learns it as personal), instead of deleting one
// character; tap-undo also fixed for Enter/newline.
// (2) Autocorrect skips words typed with any
// uppercase letter — SFC stays SFC, Guinard stays
